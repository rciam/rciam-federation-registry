version: '3'
services:
  node:
    image: node:20-bookworm
    volumes:
      - ../:/home
      - test_node_modules:/home/federation-registry-backend-api/node_modules
    depends_on:
      - database
    command: ["/home/docker/wait-for-it.sh", "database:5432", "--strict", "--timeout=60", "--", "/home/docker/run_tests.sh"]
  database:
    image: postgres:11
    volumes:
      - ./create_db.sh:/docker-entrypoint-initdb.d/create_db.sh
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres

volumes:
  test_node_modules:
